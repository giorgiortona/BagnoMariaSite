    <!--
      Icone con un nome tutto loro, non il generico /favicon.svg: in locale
      i progetti si scambiano le porte (5173, 5174, …) e il browser tiene in
      cache l'icona per origine, così ci ritrovavamo il trattore di un altro
      sito. Nome unico + ?v= evitano che le icone si mescolino.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon-bagnomaria.svg?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-bagnomaria-32.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-bagnomaria.png?v=1" />

    <meta
      name="description"
      content="Bagno Maria — lido, bar ed eventi a Santa Maria al Bagno, Nardò. Una piccola baia di sabbia, mare trasparente e tramonti sullo Ionio."
    />
    <meta name="theme-color" content="#0b79a5" />
    <meta property="og:title" content="Bagno Maria · Santa Maria al Bagno" />
    <meta property="og:description" content="Una piccola baia. Un’estate intera." />
